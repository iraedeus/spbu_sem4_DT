[tool.poetry]
name = "ml_spbu"
version = "0.1.0"
description = ""
authors = ["iraedeus <dtotjmyanin@mail.ru>"]
license = "MIT"
readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.13"
numpy = ">=2.2.3,<3.0.0"
pandas = ">=2.2.3,<3.0.0"
matplotlib = ">=3.10.0,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
scipy = ">=1.15.2,<2.0.0"
scikit-learn = "^1.6.1"
nltk = "^3.9.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.7"
mypy = "^1.15.0"
pytest = "^8.3.4"
hypothesis = "^6.127.2"
jupyterlab = ">=4.3.5,<5.0.0"


[tool.ruff]
line-length = 120
output-format = "grouped"
exclude = ["*.ipynb", "__init__.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["A", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["PLR0913"]


[tool.mypy]
ignore_missing_imports = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
