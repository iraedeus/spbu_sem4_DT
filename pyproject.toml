[project]
name = "ml_spbu"
version = "0.1.0"
description = ""
authors = [
    {name = "iraedeus", email = "dtotjmyanin@mail.ru"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab (>=4.3.5,<5.0.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "cvxopt (>=1.3.2,<2.0.0)",
    "catboost (>=1.2.8,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "nltk (>=3.9.1,<4.0.0)"
]


[tool.ruff]
line-length = 120
output-format = "grouped"
exclude = ["*.ipynb", "__init__.py", "tests/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["A", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["PLR0913"]


[tool.mypy]
ignore_missing_imports = true
files = ["ml_spbu"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "hypothesis (>=6.163.0,<7.0.0)"
]
